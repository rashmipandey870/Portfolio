<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Cyber frame -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>

  <!-- Status pill -->
  <rect x="80" y="80" width="360" height="40" rx="20" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <circle cx="102" cy="100" r="5" fill="#10B981"/>
  <text x="120" y="105" fill="#10B981" font-family="monospace" font-size="16" font-weight="bold">SDE CANDIDATE // SYSTEMS &amp; AWS</text>

  <!-- Name -->
  <text x="80" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-1">Rashmi Pandey</text>

  <!-- Headline -->
  <text x="80" y="275" fill="url(#textGrad)" font-family="system-ui, sans-serif" font-size="34" font-weight="600">Java &bull; Distributed Systems &bull; AWS Cloud Architecture</text>

  <!-- Summary text -->
  <text x="80" y="340" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="22">
    B.Tech Computer Science &bull; Summer Research Intern @ NIAMT Ranchi
  </text>
  <text x="80" y="375" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="22">
    NPTEL IIT Madras Topper (Top 2% Nationwide) &bull; Microsoft Azure DBA Certified
  </text>

  <!-- Stat badges -->
  <g transform="translate(80, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="230" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" fill="#64748B" font-family="monospace" font-size="13" font-weight="bold">NPTEL TOPPER</text>
    <text x="20" y="65" fill="#06B6D4" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">TOP 2%</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="230" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="270" y="32" fill="#64748B" font-family="monospace" font-size="13" font-weight="bold">MICROSOFT AZURE</text>
    <text x="270" y="65" fill="#10B981" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">DBA CERTIFIED</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="230" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="520" y="32" fill="#64748B" font-family="monospace" font-size="13" font-weight="bold">DSA CODING</text>
    <text x="520" y="65" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">175+ SOLVED</text>

    <!-- Badge 4 -->
    <rect x="750" y="0" width="270" height="85" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="770" y="32" fill="#64748B" font-family="monospace" font-size="13" font-weight="bold">DECISION LATENCY</text>
    <text x="770" y="65" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">SUB-100µs</text>
  </g>
</svg>
